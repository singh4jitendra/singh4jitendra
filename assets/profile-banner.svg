<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Jitendra Singh - Platform architecture, Azure Storage, and AI infrastructure</title>
  <desc id="description">A dark navy banner with teal and blue accents, connecting code, observability, and trust.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081222"/>
      <stop offset="1" stop-color="#152a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#92b9db" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="1110" cy="50" r="220" fill="#2563eb" opacity="0.08"/>
  <circle cx="920" cy="330" r="170" fill="#14b8a6" opacity="0.06"/>
  <rect x="60" y="58" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="103" font-size="18" font-weight="600" letter-spacing="3" fill="#5eead4">PLATFORM ARCHITECTURE / STORAGE / AI</text>
    <text x="56" y="180" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#f1f5f9">Jitendra Singh</text>
    <text x="60" y="230" font-size="25" fill="#cbd5e1">Cloud platforms. Intelligent recovery.</text>
    <text x="60" y="271" font-size="20" fill="#94a3b8">Azure Storage | Kubernetes &amp; OpenShift | AI for operations</text>
  </g>
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 850 172 L 1010 102 L 1084 235 Z"/>
    <path d="M 850 172 L 1084 235" stroke-dasharray="6 7"/>
  </g>
  <g fill="#0c1b2d" stroke="#2b4965" stroke-width="1.5">
    <rect x="778" y="144" width="144" height="58" rx="14"/>
    <rect x="939" y="72" width="144" height="58" rx="14"/>
    <rect x="1012" y="206" width="144" height="58" rx="14"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <text x="850" y="180" fill="#5eead4">CODE</text>
    <text x="1011" y="108" fill="#93c5fd">OBSERVE</text>
    <text x="1084" y="242" fill="#c4b5fd">TRUST</text>
  </g>
  <g fill="#5eead4">
    <circle cx="929" cy="137" r="4"/>
    <circle cx="1048" cy="170" r="4"/>
    <circle cx="971" cy="205" r="4"/>
  </g>
  <rect x="60" y="309" width="1080" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
</svg>
